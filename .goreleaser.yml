version: 2
project_name: lago

before:
  hooks:
    - go mod tidy
    - go run ./internal/gen -check
    - go test ./...

# The full os/arch matrix stays. Only the install *channels* were reduced to Homebrew
# and `go install`; re-adding a channel later is a publish-and-docs change, not a port.
builds:
  - id: lago
    main: ./cmd/lago
    binary: lago
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/getlago/lago-cli/internal/cli.version={{.Version}}

archives:
  - id: archives
    ids: [lago]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - completions/*
      - man/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

# Keyless signing over checksums.txt. The certificate is published alongside the
# signature so a consumer can run `cosign verify-blob` unaided: a signature with no
# certificate cannot be verified. Nothing in the two supported channels verifies it
# automatically today, so this is material for auditors and for anyone installing an
# archive by hand.
signs:
  - cmd: cosign
    artifacts: checksum
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}

homebrew_casks:
  - name: lago
    repository:
      owner: getlago
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://getlago.com
    description: Official CLI for the Lago billing platform
    license: MIT
    binaries: [lago]
    manpages: [man/lago.1]
    completions:
      bash: completions/lago.bash
      zsh: completions/_lago
      fish: completions/lago.fish
    url:
      verified: github.com/getlago/lago-cli/releases/download

changelog:
  use: github-native
  filters:
    exclude: ['^docs:', '^test:', '^chore:']

release:
  prerelease: auto

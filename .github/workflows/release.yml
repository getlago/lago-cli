name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.repository == 'getlago/lago-cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Two supported channels, two smoke tests. A channel with no post-release smoke test
  # is an untested channel, so this job gates the release rather than reporting on it.
  smoke-homebrew:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install from the Lago tap
        run: brew install getlago/tap/lago
      - run: lago version --output json
      - name: Doctor runs and exits 3 with no credentials
        run: lago doctor --output json || test $? -eq 3

  smoke-go-install:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install with go install
        shell: bash
        run: go install github.com/getlago/lago-cli/cmd/lago@${{ github.ref_name }}
      - name: Verify the installed binary
        shell: bash
        run: |
          "$(go env GOPATH)/bin/lago" version --output json
          "$(go env GOPATH)/bin/lago" doctor --output json || test $? -eq 3

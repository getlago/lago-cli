name: OpenAPI drift

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.repository == 'getlago/lago-cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: ./scripts/update-spec.sh
      - run: go run ./internal/docgen -markdown docs/reference -man man -completions completions
      # The published document is lago-openapi's openapi.yaml on main. The commit is
      # only linked when its blob matches the fetched file.
      - name: Describe the fetched spec
        id: spec
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(gh api 'repos/getlago/lago-openapi/commits?path=openapi.yaml&sha=main&per_page=1' --jq '.[0].sha')
          blob=$(gh api "repos/getlago/lago-openapi/contents/openapi.yaml?ref=$commit" --jq .sha)
          if [ "$blob" = "$(git hash-object spec/openapi.yaml)" ]; then
            source="[getlago/lago-openapi@${commit:0:12}](https://github.com/getlago/lago-openapi/commit/$commit)"
          else
            source="not found (the published file matches no commit on lago-openapi main)"
          fi
          {
            echo "fetched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=$(jq -r .spec_version spec/operations.json)"
            echo "sha256=$(jq -r .spec_sha256 spec/operations.json)"
            echo "source=$source"
          } >> "$GITHUB_OUTPUT"
      # A run from another branch gets its own drift branch, so it never
      # overwrites the drift PR opened from main.
      - name: Pick the drift branch
        id: branch
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "name=automation/openapi-drift" >> "$GITHUB_OUTPUT"
          else
            echo "name=automation/openapi-drift-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          fi
      # No team-reviewers: the review request fails the job while the developers team
      # has no access to this repository, or when the token has no read:org scope.
      - name: Open a reviewable drift PR
        id: drift-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SPEC_DRIFT_TOKEN || github.token }}
          branch: ${{ steps.branch.outputs.name }}
          delete-branch: true
          commit-message: "chore(spec): synchronize Lago OpenAPI"
          title: "chore(spec): synchronize Lago OpenAPI"
          body: |
            ## Context

            The CLI commands are generated from a copy of the Lago OpenAPI document kept in `spec/openapi.yaml`. A daily job compares this copy with the published document (https://swagger.getlago.com/openapi.yaml) and opens this PR when they differ.

            ## Description

            `spec/openapi.yaml` was replaced with the published document. The generated code, the command reference, the man pages and the shell completions were generated again from it.

            | | |
            |---|---|
            | Fetched at | ${{ steps.spec.outputs.fetched_at }} |
            | Spec version | `${{ steps.spec.outputs.version }}` |
            | Spec SHA-256 | `${{ steps.spec.outputs.sha256 }}` |
            | lago-openapi commit | ${{ steps.spec.outputs.source }} |
          labels: spec-drift,automated
      - name: Ask for a review on Slack
        if: steps.drift-pr.outputs.pull-request-operation == 'created' || steps.drift-pr.outputs.pull-request-operation == 'updated'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          errors: true
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: ":pr: <${{ steps.drift-pr.outputs.pull-request-url }}|${{ github.repository }}#${{ steps.drift-pr.outputs.pull-request-number }}> - `chore(spec): synchronize Lago OpenAPI`"
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          errors: true
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: ":x: lago-cli OpenAPI drift job failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Gitleaks history and worktree
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact --no-banner .
      # gosec 2.22 cannot read Go 1.27 export data ("package without types was
      # imported"), so the toolchain bump forced this pin forward. 2.23+ adds G703
      # taint analysis and G122 WalkDir TOCTOU; both fire only in the maintainer-run
      # generators, annotated at each site with why.
      - name: Gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -exclude-generated ./...
      - name: Vulnerability database
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go run ./internal/moneycheck ./...
      - run: ./scripts/check-fixtures.sh
      - run: ./scripts/check-ci-policy.sh
      - name: License compatibility
        run: ./scripts/check-licenses.sh

  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/lago-one ./cmd/lago
          CGO_ENABLED=0 go build -trimpath -o /tmp/lago-two ./cmd/lago
          cmp /tmp/lago-one /tmp/lago-two

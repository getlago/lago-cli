name: Bug report
description: Report a reproducible Lago CLI defect without including secrets or customer data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include API keys, real customer data, or private URLs. Report security issues through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Lago CLI version
      placeholder: Output of lago version
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Deployment target
      options: [Lago Cloud US, Lago Cloud EU, Self-hosted]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction with sanitized values
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
    validations:
      required: true

version: 1
name: lago-demo
vars:
  prefix: demo
steps:
  - id: metric
    method: POST
    path: /billable_metrics
    body:
      billable_metric:
        name: Demo requests
        code: ${prefix}-requests
        aggregation_type: count_agg
    capture:
      metric_id: billable_metric.lago_id
  - id: plan
    method: POST
    path: /plans
    body:
      plan:
        name: Demo usage plan
        code: ${prefix}-plan
        interval: monthly
        amount_cents: 0
        amount_currency: USD
        pay_in_advance: false
        charges:
          - billable_metric_id: ${metric_id}
            charge_model: standard
            properties:
              amount: "1"
    capture:
      plan_code: plan.code
  - id: customer
    method: POST
    path: /customers
    body:
      customer:
        external_id: ${prefix}-customer
        name: Demo Customer
        currency: USD
    capture:
      customer_id: customer.external_id
  - id: subscription
    method: POST
    path: /subscriptions
    body:
      subscription:
        external_customer_id: ${customer_id}
        external_id: ${prefix}-subscription
        plan_code: ${plan_code}
    capture:
      subscription_id: subscription.external_id
  - id: event
    method: POST
    path: /events
    body:
      event:
        transaction_id: ${prefix}-event-1
        external_subscription_id: ${subscription_id}
        code: ${prefix}-requests
  - id: invoice-preview
    method: POST
    path: /invoices/preview
    body:
      customer:
        external_id: ${customer_id}
      subscriptions:
        external_ids:
          - ${subscription_id}
    capture:
      invoice_total_cents: invoice.total_amount_cents
      invoice_currency: invoice.currency
